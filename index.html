
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Show - Spelling Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffe4ef, #e9e1ff, #ddf8f0);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  color: #453768;
}

.container {
  width: 100%;
  max-width: 520px;
  background: white;
  padding: 25px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 35px #6b529c30;
}

h1 {
  color: #8055d6;
  font-size: 30px;
  margin-bottom: 5px;
}

h3 {
  margin-top: 12px;
}

.subtitle {
  color: #999;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #dfd4ff;
  border-radius: 13px;
  font-size: 18px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #8055d6;
}

button {
  border: none;
  padding: 14px 25px;
  border-radius: 13px;
  background: #8055d6;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #6740bd;
}

.hidden {
  display: none !important;
}

.animal {
  font-size: 125px;
  margin: 15px 0;
}

.lives {
  font-size: 30px;
  letter-spacing: 7px;
  margin: 12px;
}

.progress {
  height: 10px;
  background: #eee;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0;
}

.bar {
  height: 100%;
  background: linear-gradient(90deg, #ff80ad, #8055d6);
  width: 0%;
  transition: width .3s;
}

#feedback {
  min-height: 35px;
  font-weight: bold;
  font-size: 19px;
  margin-top: 15px;
}

.green {
  color: #20a36c;
}

.red {
  color: #e34c73;
}

.result-icon {
  font-size: 90px;
  margin: 15px;
}

.result-score {
  font-size: 40px;
  color: #8055d6;
  font-weight: bold;
}

.small {
  color: #999;
  font-size: 13px;
}

.teacher {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #eee;
  color: #8055d6;
  font-weight: bold;
  font-size: 15px;
  letter-spacing: .3px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🐾 PET SHOW</h1>
  <h3>SPELLING CHALLENGE</h3>
  <p class="subtitle">Let's play and learn!</p>

  <!-- START SCREEN -->

  <div id="start">

    <h3>Welcome to the Animal Challenge!</h3>

    <p>Enter your name to start the game.</p>

    <input
      id="studentName"
      type="text"
      placeholder="Your Name"
      maxlength="30"
      autocomplete="off"
    >

    <br>

    <button onclick="startGame()">
      START GAME 🚀
    </button>

    <p class="small">
      You have 3 lives. Be careful!
    </p>

  </div>


  <!-- GAME SCREEN -->

  <div id="game" class="hidden">

    <h3 id="welcome"></h3>

    <div class="lives" id="lives">
      ❤️ ❤️ ❤️
    </div>

    <p id="questionNumber">Question 1 / 9</p>

    <div class="progress">
      <div class="bar" id="progressBar"></div>
    </div>

    <div class="animal" id="animal"></div>

    <h3>What is it?</h3>

    <input
      id="answer"
      type="text"
      placeholder="Type your answer..."
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >

    <br>

    <button id="checkButton" onclick="checkAnswer()">
      CHECK ANSWER ✓
    </button>

    <p id="feedback"></p>

    <button
      id="nextButton"
      class="hidden"
      onclick="nextQuestion()"
    >
      NEXT ➜
    </button>

  </div>


  <!-- RESULT SCREEN -->

  <div id="result" class="hidden">

    <div class="result-icon" id="resultIcon"></div>

    <h1 id="resultTitle"></h1>

    <h3 id="finalName"></h3>

    <div class="result-score" id="finalScore"></div>

    <p id="finalMessage"></p>

    <p id="finalLives"></p>

    <button onclick="location.reload()">
      PLAY AGAIN 🔄
    </button>

  </div>


  <!-- TEACHER NAME -->

  <div class="teacher">
    Created by Ms. Ramezanzadeh
  </div>

</div>


<script>

const animals = [
  { word: "donkey", emoji: "🫏" },
  { word: "elephant", emoji: "🐘" },
  { word: "spider", emoji: "🕷️" },
  { word: "cat", emoji: "🐱" },
  { word: "rat", emoji: "🐀" },
  { word: "frog", emoji: "🐸" },
  { word: "duck", emoji: "🦆" },
  { word: "lizard", emoji: "🦎" },
  { word: "dog", emoji: "🐶" }
];

let questions = [];
let current = 0;
let lives = 3;
let score = 0;
let student = "";
let answered = false;
let transitionTimer = null;


// START GAME

function startGame() {

  student = document
    .getElementById("studentName")
    .value.trim();

  if (!student) {
    alert("Please enter your name!");
    return;
  }

  questions = [...animals];

  // Shuffle questions randomly

  for (let i = questions.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [questions[i], questions[j]] =
    [questions[j], questions[i]];

  }

  current = 0;
  lives = 3;
  score = 0;

  document.getElementById("start")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.remove("hidden");

  document.getElementById("welcome")
    .innerText = "Good luck, " + student + "!";

  updateLives();
  showQuestion();

}


// UPDATE LIVES

function updateLives() {

  document.getElementById("lives").innerText =
    "❤️ ".repeat(lives) +
    "🖤 ".repeat(3 - lives);

}


// SHOW QUESTION

function showQuestion() {

  answered = false;

  const item = questions[current];

  document.getElementById("questionNumber")
    .innerText =
    "Question " + (current + 1) + " / 9";

  document.getElementById("progressBar")
    .style.width =
    (current / questions.length * 100) + "%";

  document.getElementById("animal")
    .innerText = item.emoji;

  document.getElementById("answer").value = "";
  document.getElementById("answer").disabled = false;

  document.getElementById("feedback").innerText = "";
  document.getElementById("feedback").className = "";

  document.getElementById("checkButton")
    .classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.add("hidden");

  document.getElementById("answer").focus();

}


// CHECK ANSWER

function checkAnswer() {

  if (answered) return;

  const input = document.getElementById("answer");

  const userAnswer = input.value
    .trim()
    .toLowerCase();

  const correctAnswer = questions[current].word;

  if (!userAnswer) {

    document.getElementById("feedback").innerText =
      "Please type your answer!";

    document.getElementById("feedback").className = "red";

    return;
  }

  answered = true;
  input.disabled = true;

  document.getElementById("checkButton")
    .classList.add("hidden");


  // CORRECT ANSWER

  if (userAnswer === correctAnswer) {

    score++;

    document.getElementById("feedback").innerText =
      "CORRECT! AMAZING JOB! 🎉";

    document.getElementById("feedback").className =
      "green";

    // Automatically go to the next question

    transitionTimer = setTimeout(function() {

      current++;

      if (current >= questions.length) {

        finishGame(true);

      } else {

        showQuestion();

      }

    }, 1000);

  }


  // WRONG ANSWER

  else {

    lives--;
    updateLives();

    document.getElementById("feedback").innerText =
      "WRONG! The correct answer is " +
      correctAnswer.toUpperCase();

    document.getElementById("feedback").className =
      "red";

    // Game over when all lives are lost

    if (lives === 0) {

      transitionTimer = setTimeout(function() {
        finishGame(false);
      }, 1200);

    } else {

      document.getElementById("nextButton")
        .classList.remove("hidden");

    }

  }

}


// NEXT QUESTION AFTER A WRONG ANSWER

function nextQuestion() {

  current++;

  if (current >= questions.length) {

    finishGame(true);

  } else {

    showQuestion();

  }

}


// FINISH GAME

function finishGame(won) {

  document.getElementById("game")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.remove("hidden");

  document.getElementById("progressBar")
    .style.width = "100%";

  document.getElementById("finalName")
    .innerText = "Student: " + student;

  document.getElementById("finalScore")
    .innerText = score + " / 9";

  document.getElementById("finalLives")
    .innerText = "Lives remaining: " + lives;


  // WIN

  if (won) {

    document.getElementById("resultIcon")
      .innerText = "🏆";

    document.getElementById("resultTitle")
      .innerText = "YOU WIN!";

    document.getElementById("resultTitle")
      .style.color = "#20a36c";

    document.getElementById("finalMessage")
      .innerText =
      "Congratulations! You completed all 9 questions!";

  }


  // GAME OVER

  else {

    document.getElementById("resultIcon")
      .innerText = "💔";

    document.getElementById("resultTitle")
      .innerText = "GAME OVER!";

    document.getElementById("resultTitle")
      .style.color = "#e34c73";

    document.getElementById("finalMessage")
      .innerText =
      "You lost all your lives! Try again!";

  }

}


// ENTER KEY SUPPORT

document.getElementById("answer")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      if (!document.getElementById("nextButton")
        .classList.contains("hidden")) {

        nextQuestion();

      } else {

        checkAnswer();

      }

    }

  });


document.getElementById("studentName")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      startGame();
    }

  });

</script>

</body>
</html>
